version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: hotel-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: hotel_db
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    ports:
      - "3398:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./hotel-swing/src/main/resources/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  hotel-app:
    build:
      context: ./hotel-swing
      dockerfile: Dockerfile
    container_name: hotel-app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:6080"

volumes:
  mysql_data:
